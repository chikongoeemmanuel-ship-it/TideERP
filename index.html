<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a1e36">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tide ERP">
  <meta name="description" content="Tide ERP — a sales-led business workspace for teams in Tanzania.">
  <link rel="icon" href="tide.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <title>Tide ERP — Business workspace</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="app.css?v=151">
  <style>
    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #0a1e36;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'IBM Plex Sans', sans-serif;
      transition: opacity .18s ease
    }

    #boot-splash.is-done {
      opacity: 0;
      pointer-events: none
    }

    #boot-splash .boot-logo {
      width: 54px;
      height: 54px;
      border-radius: 14px;
      background: #0082cf;
      color: #fff;
      font-size: 28px;
      font-weight: 800;
      display: grid;
      place-items: center;
      box-shadow: 0 10px 28px rgba(0, 130, 207, .38)
    }

    #boot-splash .boot-bar {
      width: 120px;
      height: 3px;
      border-radius: 99px;
      background: rgba(255, 255, 255, .15);
      overflow: hidden
    }

    #boot-splash .boot-bar i {
      display: block;
      width: 45%;
      height: 100%;
      background: #38bdf8;
      border-radius: 99px;
      animation: bootSlide 1s ease-in-out infinite
    }

    @keyframes bootSlide {
      0% {
        transform: translateX(-100%)
      }

      100% {
        transform: translateX(260%)
      }
    }
  </style>
</head>

<body>
  <div id="boot-splash" aria-label="Loading Tide ERP">
    <div class="boot-logo">t</div>
    <div class="boot-bar"><i></i></div>
  </div>
  <section class="auth-gate" id="auth-gate" aria-live="polite" hidden></section>
  <div class="app-shell" hidden>
    <div class="sidebar-backdrop" id="sidebar-backdrop" aria-hidden="true"></div>
    <div class="sidebar-hover-zone" id="sidebar-hover-zone" aria-hidden="true"></div>
    <aside class="sidebar" id="sidebar">

      <div class="workspace-switch" id="workspace-switch" aria-label="Company settings" title="Company settings"
        data-page="settings" style="cursor:pointer"><span class="workspace-avatar">M</span></div>
      <nav class="primary-nav" aria-label="Main navigation">
        <p class="nav-label">WORKSPACE</p>
        <button class="nav-item active" data-page="dashboard"><span class="nav-icon">◫</span>Overview</button>
        <button class="nav-item" data-page="sales"><span class="nav-icon">↗</span>Sales <span class="nav-count"
            id="order-count">0</span></button>
        <button class="nav-item" data-page="pos"><span class="nav-icon">▦</span>Point of sale</button>
        <button class="nav-item" data-page="products"><span class="nav-icon">📦</span>Products</button>
        <button class="nav-item" data-page="inventory"><span class="nav-icon">▤</span>Inventory</button>
        <button class="nav-item" data-page="purchases"><span class="nav-icon">⇩</span>Purchases</button>
        <button class="nav-item" data-page="expenses"><span class="nav-icon">🧾</span>Expenses</button>
        <p class="nav-label nav-label-spaced">MANAGE</p>
        <button class="nav-item" data-page="customers"><span class="nav-icon">♙</span>Customers</button>
        <button class="nav-item" data-page="suppliers"><span class="nav-icon">♧</span>Suppliers</button><button
          class="nav-item" data-page="users"><span class="nav-icon">♙</span>Users</button><button class="nav-item"
          data-page="branches"><span class="nav-icon">▦</span>Branches</button>
        <button class="nav-item" data-page="accounting"><span class="nav-icon">◈</span>Accounting</button>
        <button class="nav-item" data-page="reports"><span class="nav-icon">▥</span>Reports</button>
        <button class="nav-item" data-page="settings"><span class="nav-icon">⚙</span>Settings</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="offline-indicator"><span class="online-dot" id="connection-dot"></span><span
            id="connection-label">All changes saved</span></div><button type="button" class="profile-button"
          data-action="my-account"><span class="profile-avatar">AD</span><span
            class="profile-copy"><strong>Administrator</strong><small>Administrator</small></span><span
            class="chevron">···</span></button>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar"><button class="sidebar-toggle" id="sidebar-toggle" type="button"
          aria-label="Open navigation" title="Open navigation">☰</button><a class="topbar-brand" href="#home"
          data-page="home" aria-label="TideERP home"><span class="brand-mark">t</span><span>Tide<span
              class="brand-muted">ERP</span></span></a><button class="back-button" id="back-button"
          aria-label="Go to previous section" disabled>← <span>Back</span></button>
        <div class="breadcrumb"><strong id="crumb-current">Overview</strong></div>
        <div class="topbar-actions"><span class="today-label" id="today-label"></span><button
            class="icon-button lang-toggle-btn" id="lang-toggle" data-action="toggle-language" type="button"
            aria-label="Language: English (Click to switch to Kiswahili)"
            title="Language: English (Click to switch to Kiswahili)">EN</button><button class="icon-button"
            id="theme-toggle" type="button" aria-label="Switch to dark mode"
            title="Switch to dark mode">☾</button><button class="icon-button" id="install-button"
            title="Install Tide ERP" hidden>⇩</button><button class="icon-button notification-button"
            id="notifications-button" type="button" aria-label="Notifications"
            title="Notifications">🔔<i></i></button><button class="icon-button activity-button" id="activity-button"
            type="button" aria-label="Activity history" title="Activity history" hidden>◷</button><button
            class="topbar-avatar profile-trigger" id="user-profile-button" data-action="my-account" type="button"
            aria-label="User credentials and profile" title="User profile">AD</button></div>
      </header>
      <div class="page-wrap" id="page-content" aria-live="polite"></div>

      <!-- App Bottom Bar: Cloud Sync Status & Branch Switcher -->
      <footer class="app-footer-bar" id="app-footer-bar">
        <div class="footer-actions-cluster">
          <button class="footer-action-button cloud-sync-button" id="cloud-sync-button" type="button"
            aria-label="Cloud sync status" title="Cloud Sync: Live">
            <span class="footer-icon-badge" id="cloud-sync-indicator" style="color:#00a651">☁</span>
            <span class="footer-btn-text">Cloud Sync</span>
          </button>
          <button class="footer-action-button branch-switch-button" id="branch-switch-button" type="button"
            aria-label="Switch branch" title="Switch branch">
            <span class="footer-icon-badge">🏢</span>
            <span class="footer-btn-text" id="footer-branch-label">Main branch</span>
          </button>
          <button class="footer-action-button footer-lock-button" id="lock-session-button" data-action="lock-screen"
            type="button" aria-label="Lock screen now" title="Auto-lock timer (click to lock now)">
            <span class="footer-icon-badge">🔒</span>
            <span class="footer-btn-text font-mono" id="footer-lock-countdown">20:00</span>
          </button>
        </div>
        <div class="footer-status-tag">
          <span class="footer-live-beacon"></span>
          <span id="footer-sync-status-text">Multi-device Live</span>
        </div>
      </footer>

      <!-- Phone Quick Bottom Navigation (visible on <= 760px screens) -->
      <nav class="mobile-bottom-nav" id="mobile-bottom-nav" aria-label="Mobile quick navigation">
        <button type="button" class="mob-nav-btn active" data-page="home"><span class="mob-nav-ico">⌂</span><span class="mob-nav-lbl">Home</span></button>
        <button type="button" class="mob-nav-btn" data-page="pos"><span class="mob-nav-ico">▦</span><span class="mob-nav-lbl">POS</span></button>
        <button type="button" class="mob-nav-btn" data-page="sales"><span class="mob-nav-ico">↗</span><span class="mob-nav-lbl">Sales</span></button>
        <button type="button" class="mob-nav-btn" data-page="products"><span class="mob-nav-ico">📦</span><span class="mob-nav-lbl">Products</span></button>
        <button type="button" class="mob-nav-btn" data-action="toggle-mobile-menu"><span class="mob-nav-ico">☰</span><span class="mob-nav-lbl">Menu</span></button>
      </nav>
    </main>
  </div>
  <section class="screen-lock-overlay" id="screen-lock-overlay" aria-live="polite" hidden></section>
  <div class="auto-lock-warning" id="auto-lock-warning" hidden></div>
  <div class="toast-region" id="toast-region" popover="manual" aria-live="polite"></div>
  <dialog class="modal" id="app-modal">
    <form method="dialog" class="modal-card" id="modal-content"></form>
  </dialog>
  <!-- Firebase Real-Time Cloud Synchronization (deferred for instant first paint) -->
  <script defer src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script defer src="firebase.js?v=8"></script>
  <script defer src="db.js?v=119"></script>
  <script defer src="tax.js?v=94"></script>
  <script defer src="trash.js?v=97"></script>
  <script defer src="table-tools.js?v=5"></script>
  <script defer src="i18n.js?v=5"></script>
  <script defer src="app.js?v=204"></script>
</body>

</html>
